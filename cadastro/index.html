<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta
    name="description"
    content="Cadastro de emissoras na Central Rádios Brasil."
  >
  <meta name="theme-color" content="#00173d">
  <title>Cadastre sua rádio — Central Rádios Brasil</title>
  <link rel="stylesheet" href="../style.css?v=22.3.6">
</head>
<body>

  <header class="cabecalho">
    <div class="cabecalho-conteudo">

      <a
        class="marca"
        href="../"
        aria-label="Voltar para a Central Rádios Brasil"
      >
        <img
          class="marca-logo"
          src="../logo-central-radios-brasil.jpeg.jpeg"
          alt="Logo Central Rádios Brasil"
        >

        <div class="marca-texto">
          <strong>Central Rádios Brasil</strong>
          <span>Portal da Emissora</span>
        </div>
      </a>

      <div class="versao-banco">
        Cadastro
      </div>

    </div>
  </header>

  <main class="pagina-cadastro-temporaria">

    <section class="cadastro-temporario-card">

      <div
        class="cadastro-temporario-icone"
        aria-hidden="true"
      >
        📻
      </div>

      <span class="titulo-menor">
        PORTAL DA EMISSORA
      </span>

      <h1>Cadastre sua rádio</h1>

      <p>
        O formulário oficial de cadastro está sendo preparado.
        Na próxima etapa, esta página receberá o cadastro completo
        para análise e aprovação da Central Rádios Brasil.
      </p>

      <div class="cadastro-temporario-voltar">
        <a
          class="hero-botao hero-botao-principal"
          href="../"
        >
          ← Voltar para o portal
        </a>
      </div>

    </section>

  </main>

</body>
</html>
