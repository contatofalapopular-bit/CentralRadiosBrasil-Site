<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#00173d">
  <title>Sem conexão — Central Rádios Brasil</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;background:radial-gradient(circle at 20% 10%,rgba(0,140,255,.28),transparent 32%),linear-gradient(180deg,#020817,#061b3a);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(560px,100%);padding:32px;border:1px solid rgba(255,255,255,.14);border-radius:28px;text-align:center;background:rgba(7,27,58,.88);box-shadow:0 30px 90px rgba(0,0,0,.45)}img{width:112px;height:112px;object-fit:cover;margin:0 auto 20px;border-radius:28px;border:1px solid rgba(55,230,255,.34)}h1{margin:0 0 12px;font-size:clamp(2rem,7vw,3.4rem);letter-spacing:-.05em}p{margin:0 auto 22px;max-width:440px;color:#b8cce5;line-height:1.6}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border:0;border-radius:999px;font:inherit;font-weight:900;cursor:pointer;text-decoration:none}button{color:#001127;background:#37e6ff}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}small{display:block;margin-top:20px;color:#7f9abb;line-height:1.5}
  </style>
</head>
<body>
  <main class="card" id="conteudo-principal" tabindex="-1">
    <img src="/icons/icon-192-v22113.png" alt="Central Rádios Brasil">
    <h1>Sem conexão</h1>
    <p>O portal está instalado e algumas páginas continuam disponíveis. Para ouvir as rádios ao vivo, reconecte-se à internet.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
    <small>A Central tentará retomar o conteúdo atualizado assim que a conexão voltar.</small>
  </main>
</body>
</html>
